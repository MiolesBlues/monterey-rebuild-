[Rainmeter]
OnRefreshAction=[!UpdateMeasure PowerState][!WriteKeyValue Variables BatterySaverMode (1-[PowerState]) "#@#Variables\Global.inc"]
Group=Monterey
Update=1000
DefaultUpdateDivider=-1
DefaultClickThroughDefault=1

[Variables]
@include1=#@#Variables\Global.inc

[DummyMeter]
Meter=String

[PowerState]
Measure=Plugin
Plugin=PowerPlugin
PowerState=ACLine
UpdateDivider=60
OnChangeAction=[!WriteKeyValue Variables BatterySaverMode (1-[PowerState]) "#@#Variables\Global.inc"][!RefreshGroup Monterey]
W=(#WidgetHeight#*0.06)
X=(#WidgetPadding#+#WidgetWidth#*0.06)
ImageName=#@#Images\Monitor\#Meter2#.png
Y=(#WidgetPadding#+#WidgetHeight#*0.225)

